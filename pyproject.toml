[project]
name = "strikeone"
version = "0.1.0"
description = "Episode-aware CNP fraud risk engine on IEEE-CIS. Razorpay AI Buildathon, AI Risk Manager track."
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
]

[project.scripts]
strikeone = "strikeone.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strikeone"]

[tool.pytest.ini_options]
testpaths = ["tests", "extras"]
