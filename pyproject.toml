[project]
name = "strikeone"
version = "1.3.0"
description = "Bring-your-own-scorer fraud evaluation: cases caught at the first labelled transaction vs your headline metric, blocklist routing, cost-derived actions, and a citation-validated AI narration layer. Offline; your data never leaves the machine."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Shhaurya Jaiswal", email = "shivaanroy614@gmail.com" }]
keywords = [
    "fraud-detection", "fraud", "risk", "evaluation", "chargeback",
    "label-propagation", "blocklist", "cost-sensitive", "payments",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=3.0.5",
    "pyarrow>=15.0",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
db = ["sqlalchemy>=2.0"]                       # database-URL sources
tui = ["nodejs-wheel-binaries>=18"]            # pip-managed Node runtime
research = ["lightgbm>=4.7.0", "matplotlib>=3.8"]  # reproduce the study

[project.urls]
Homepage = "https://github.com/Thebinary110/Strike-One"
Repository = "https://github.com/Thebinary110/Strike-One"
Issues = "https://github.com/Thebinary110/Strike-One/issues"
Findings = "https://github.com/Thebinary110/Strike-One/blob/main/FINDINGS.md"

[project.scripts]
strikeone = "strikeone.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/strikeone"]
# the bundled TUI is gitignored (built by `npm run bundle`); artifacts
# opts it back into the wheel when present at build time
artifacts = ["src/strikeone/_tui/*.mjs"]

[tool.hatch.build.targets.sdist]
include = ["src/strikeone", "README.md", "LICENSE", "pyproject.toml"]
artifacts = ["src/strikeone/_tui/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests", "extras"]
